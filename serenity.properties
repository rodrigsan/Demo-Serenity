serenity.project.name=SWAG LABS
serenity.test.root=com.swag.pe

# Configuración del navegador (Chrome en modo invisible para CI/CD)
webdriver.driver=chrome
headless.mode=true

# Aumentar tiempo de espera de búsqueda de elementos (de 2 a 10 segundos)
serenity.timeout=10
webdriver.timeouts.implicitlywait=10000

# Parámetros para estabilidad en ejecuciones automatizadas
chrome.switches=--start-maximized;--headless=new;--remote-allow-origins=*;--no-sandbox;--disable-dev-shm-usage

serenity.browser.maximized=true
serenity.use.unique.browser=false
serenity.restart.browser.each.scenario=true
